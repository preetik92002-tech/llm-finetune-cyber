# Smoke test: a tiny run that only checks the pipeline works end to end.
# It says nothing about model quality. Run: python src/train.py --config configs/smoke_test.yaml

model_name: Qwen/Qwen2.5-0.5B-Instruct
train_file: data/processed/severity_train.jsonl   # relative to the repo root
output_dir: outputs/smoke_test                    # adapter is saved here (git-ignored)

max_samples: 50                  # use only the first 50 examples (after a seeded shuffle)
max_steps: 20                    # stop after 20 optimizer steps
max_length: 512                  # tokens per example; longer ones are cut
per_device_train_batch_size: 2   # examples per forward pass (tiny, to fit a small GPU)
gradient_accumulation_steps: 4   # 2 x 4 = 8 examples per optimizer step
learning_rate: 0.0002            # typical for LoRA; higher than full fine-tuning
warmup_steps: 2
seed: 42

lora:
  r: 16                          # adapter size: higher = more capacity, more memory
  alpha: 32                      # scaling of the adapter output
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

wandb_project: cyber-slm         # used only if WANDB_API_KEY is set
